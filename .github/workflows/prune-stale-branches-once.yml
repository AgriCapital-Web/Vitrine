name: Nettoyage ponctuel des branches historiques

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune:
    if: contains(github.event.head_commit.message, '[prune-stale-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les branches secondaires auditées
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          failed=0
          for branch in "${branches[@]}"; do
            [[ "${branch}" == "main" ]] && continue
            echo "Suppression de la branche : ${branch}"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "::error::Impossible de supprimer ${branch}"
              failed=1
            fi
          done
          [[ "${failed}" -eq 0 ]]
